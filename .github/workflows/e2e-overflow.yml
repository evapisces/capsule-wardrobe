name: e2e-overflow

# Real headless-browser guard for the "no horizontal overflow at mobile/tablet
# widths" acceptance criterion (issues #3–#6, #13). No Postgres / server needed —
# the test stubs every /api/** response.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Type-check the e2e suite against @capsule/shared
        working-directory: client
        run: npm run test:e2e:typecheck

      - name: Install Playwright browser
        working-directory: client
        run: npm run test:e2e:install

      - name: Run overflow e2e suite
        working-directory: client
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
